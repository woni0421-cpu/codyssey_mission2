<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리건물 커뮤니티</title>
    <style>
        /* 기본 스타일 및 모바일 앱 레이아웃 설정 */
        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }
        #app-container {
            width: 100%;
            max-width: 480px; /* 모바일 화면 너비 제한 */
            height: 100vh;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        
        /* 헤더 및 하단 네비게이션 */
        header {
            background-color: #ffffff;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #eeeeee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            cursor: pointer;
            font-size: 20px;
            display: none; /* 기본적으로 숨김 */
        }
        nav {
            background-color: #ffffff;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }
        nav button {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        nav button.active { color: #007bff; font-weight: bold; }

        /* 페이지 전환용 클래스 */
        .page {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 60px; /* 네비게이션 바 공간 */
        }
        .page.active { display: block; }

        /* 공통 UI 요소 */
        .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .btn-primary:disabled { background-color: #cccccc; }
        .content-pad { padding: 20px; }
        
        /* 리스트 스타일 (게시글, 채팅 등) */
        .list-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .list-item:hover { background-color: #f9f9f9; }
        .tag {
            font-size: 12px;
            background-color: #e9ecef;
            padding: 3px 8px;
            border-radius: 12px;
            color: #495057;
            margin-bottom: 5px;
            display: inline-block;
        }
        .title { font-size: 16px; font-weight: bold; margin: 5px 0; }
        .preview { font-size: 14px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 12px; color: #999; margin-top: 8px; }

        /* 카테고리 그리드 */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .category-btn {
            background: white; border: 1px solid #ddd; border-radius: 8px;
            padding: 15px 5px; font-size: 12px; text-align: center; cursor: pointer;
        }

        /* 폼 요소 */
        input, textarea, select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
            font-family: inherit;
        }
        textarea { height: 150px; resize: none; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 14px; }

        /* 플로팅 액션 버튼 (글쓰기) */
        .fab {
            position: absolute; bottom: 80px; right: 20px;
            width: 50px; height: 50px; border-radius: 25px;
            background-color: #007bff; color: white;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            cursor: pointer; z-index: 5;
        }

        /* 채팅방 스타일 */
        .chat-box { display: flex; flex-direction: column; padding: 20px; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 15px; font-size: 14px; }
        .msg.me { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.other { background-color: #f1f3f5; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area {
            display: flex; padding: 10px; border-top: 1px solid #ddd;
            position: absolute; bottom: 0; width: 100%; box-sizing: border-box; background: white;
        }
        .chat-input-area input { margin-bottom: 0; border-radius: 20px; }
        .chat-input-area button { width: 60px; margin-left: 10px; border-radius: 20px; }

        /* 댓글 영역 */
        .comment-section { border-top: 8px solid #f0f2f5; padding: 20px; }
        .comment { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
        .comment-meta { font-size: 12px; color: #888; margin-bottom: 5px; display: flex; justify-content: space-between;}

        /* 모달 (신고 등) */
        .modal-overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 80%; }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 헤더 -->
    <header id="app-header">
        <span class="back-btn" id="btn-back" onclick="goBack()">←</span>
        <span id="header-title">우리건물 커뮤니티</span>
    </header>

    <!-- 1. 위치 인증 화면 (첫 화면) -->
    <div id="page-auth" class="page active">
        <div class="content-pad" style="text-align: center; margin-top: 50px;">
            <h2>📍 건물 위치 인증</h2>
            <p style="color: #666; margin-bottom: 40px;">
                안전한 커뮤니티를 위해<br>현재 위치가 건물 내에 있는지 확인합니다.
            </p>
            <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 30px;">
                <p style="font-size: 14px; color: #888;">(현재는 데모 버전입니다. 아래 버튼을 눌러 체험해 보세요.)</p>
            </div>
            <button class="btn-primary" onclick="loginDemo()">데모 버전으로 시작하기</button>
        </div>
    </div>

    <!-- 2. 홈 화면 -->
    <div id="page-home" class="page">
        <div class="category-grid">
            <div class="category-btn" onclick="goCategory('자유게시판')">💬<br>자유게시판</div>
            <div class="category-btn" onclick="goCategory('분실물')">🔍<br>분실물</div>
            <div class="category-btn" onclick="goCategory('장터/나눔')">🛒<br>장터/나눔</div>
            <div class="category-btn" onclick="goCategory('빌려주세요')">🤝<br>빌려주세요</div>
            <div class="category-btn" onclick="goCategory('공동구매')">📦<br>공동구매</div>
            <div class="category-btn" onclick="goCategory('배달 같이하기')">🛵<br>배달 같이</div>
            <div class="category-btn" onclick="goCategory('층간소음')">🤫<br>층간소음</div>
            <div class="category-btn" onclick="goCategory('전체')">📋<br>전체글</div>
        </div>
        <div style="padding: 15px 20px; font-weight: bold; border-bottom: 1px solid #eee;">최신 게시글</div>
        <div id="home-post-list">
            <!-- JS로 렌더링 됨 -->
        </div>
        <div class="fab" onclick="goWrite()">+</div>
    </div>

    <!-- 3. 게시판(카테고리) 목록 화면 -->
    <div id="page-board" class="page">
        <div id="board-post-list">
            <!-- JS로 렌더링 됨 -->
        </div>
        <div class="fab" onclick="goWrite()">+</div>
    </div>

    <!-- 4. 글쓰기 화면 -->
    <div id="page-write" class="page">
        <div class="content-pad">
            <select id="write-category" onchange="checkCategoryRule()">
                <option value="자유게시판">자유게시판</option>
                <option value="분실물">분실물</option>
                <option value="장터/나눔">장터/나눔</option>
                <option value="빌려주세요">빌려주세요</option>
                <option value="공동구매">공동구매</option>
                <option value="배달 같이하기">배달 같이하기</option>
                <option value="층간소음">층간소음</option>
            </select>
            <input type="text" id="write-title" placeholder="제목을 입력하세요">
            <textarea id="write-content" placeholder="내용을 입력하세요"></textarea>
            
            <div class="checkbox-group">
                <input type="checkbox" id="write-anon" style="width:auto; margin:0;">
                <label for="write-anon" id="write-anon-label">익명으로 작성하기</label>
            </div>
            <p id="write-warning" style="color: red; font-size: 12px; display: none; margin-top:-10px; margin-bottom:15px;">
                * 장터/나눔 게시판은 익명으로 작성할 수 없습니다.
            </p>
            
            <button class="btn-primary" onclick="submitPost()">등록하기</button>
        </div>
    </div>

    <!-- 5. 게시글 상세 화면 -->
    <div id="page-detail" class="page">
        <div class="content-pad" id="detail-content-area">
            <!-- JS로 렌더링 -->
        </div>
        <div class="comment-section">
            <div style="font-weight: bold; margin-bottom: 15px;">댓글</div>
            <div id="detail-comments">
                <!-- JS로 렌더링 -->
            </div>
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <div class="checkbox-group" style="margin-bottom: 0;">
                    <input type="checkbox" id="comment-anon" style="width:auto; margin:0;">
                    <label for="comment-anon">익명</label>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="comment-input" placeholder="댓글을 남겨보세요" style="margin-bottom: 0;">
                    <button class="btn-primary" style="width: 80px;" onclick="submitComment()">등록</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 6. 채팅 목록 화면 -->
    <div id="page-chat-list" class="page">
        <div id="chat-list-area">
            <!-- JS로 렌더링 -->
        </div>
    </div>

    <!-- 7. 1:1 채팅방 화면 -->
    <div id="page-chat-room" class="page" style="padding-bottom: 60px;">
        <div style="background: #f8f9fa; padding: 10px 20px; font-size: 12px; color: #666; border-bottom: 1px solid #eee;" id="chat-room-info">
            <!-- 연결된 게시글 정보 -->
        </div>
        <div class="chat-box" id="chat-messages">
            <!-- JS로 렌더링 -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="메시지 보내기">
            <button class="btn-primary" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <!-- 8. 마이페이지 -->
    <div id="page-mypage" class="page">
        <div class="content-pad">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 30px;">
                <div style="width: 60px; height: 60px; background: #ddd; border-radius: 30px;"></div>
                <div>
                    <h3 style="margin: 0;" id="my-nickname">입주민_데모</h3>
                    <p style="margin: 5px 0 0 0; font-size: 12px; color: #007bff;">✅ 위치 인증 완료 (행복아파트 101동)</p>
                </div>
            </div>
            
            <div class="list-item" onclick="alert('데모 버전에서는 제공되지 않습니다.')">내가 쓴 글</div>
            <div class="list-item" onclick="alert('데모 버전에서는 제공되지 않습니다.')">내가 쓴 댓글</div>
            <div class="list-item" onclick="alert('데모 버전에서는 제공되지 않습니다.')">닉네임 수정</div>
            <div class="list-item" style="color: red;" onclick="logout()">로그아웃</div>
        </div>
    </div>

    <!-- 하단 네비게이션 (인증 화면, 채팅방 등에서는 숨김 처리) -->
    <nav id="bottom-nav" style="display: none;">
        <button id="nav-home" class="active" onclick="goHome()">🏠<br>홈</button>
        <button id="nav-chat" onclick="goChatList()">💬<br>채팅</button>
        <button id="nav-mypage" onclick="goMyPage()">👤<br>마이페이지</button>
    </nav>

    <!-- 신고 모달 -->
    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-top: 0;">신고하기</h3>
            <p style="font-size: 14px; color: #666;">신고 사유를 선택해주세요.</p>
            <select id="report-reason">
                <option>욕설/비방</option>
                <option>도배</option>
                <option>사기 의심</option>
                <option>개인정보 노출</option>
                <option>기타</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn-primary" style="background: #ccc;" onclick="closeReportModal()">취소</button>
                <button class="btn-primary" style="background: red;" onclick="submitReport()">신고 접수</button>
            </div>
        </div>
    </div>

</div>

<script>
    /* ==========================================
       1. 데이터 모델 (메모리 DB 역할)
       ========================================== */
    const currentUser = {
        id: 'user_me',
        nickname: '행복한입주민',
        isAuth: false
    };

    // 초기 게시글 데이터 (마크다운 예시 반영)
    let posts = [
        { id: 1, category: '자유게시판', title: '엘리베이터 공사 시간 아시는 분?', content: '오늘 아침부터 안내문이 붙어 있던데 정확한 시간이 안 적혀있네요. 혹시 아시는 분 계신가요?', authorId: 'user1', authorName: '익명', isAnon: true, time: '10분 전', comments: [] },
        { id: 2, category: '분실물', title: '1층 로비에서 키링 보신 분', content: '어제 저녁 8시쯤 1층 로비를 지나갔는데 곰돌이 모양 키링을 떨어뜨린 것 같아요.', authorId: 'user2', authorName: '익명', isAnon: true, time: '1시간 전', comments: [] },
        { id: 3, category: '장터/나눔', title: '전자레인지 판매합니다', content: '1년 정도 사용했고 작동 잘 됩니다. 직접 가져가실 분 구해요. 가격은 2만원입니다.', authorId: 'user3', authorName: '3층주민', isAnon: false, time: '2시간 전', comments: [] },
        { id: 4, category: '층간소음', title: '밤 11시 이후 소음 관련해서요', content: '최근 며칠 동안 늦은 시간에 쿵쿵거리는 소리가 계속 들리네요. 조금만 주의 부탁드립니다.', authorId: 'user4', authorName: '익명', isAnon: true, time: '3시간 전', comments: [] }
    ];

    let chats = []; // { id, postId, partnerName, messages: [{sender, text}] }
    let currentViewPostId = null;
    let currentChatId = null;
    let historyStack = []; // 뒤로가기를 위한 히스토리

    /* ==========================================
       2. 화면 이동 및 네비게이션 로직
       ========================================== */
    function showPage(pageId, title = '우리건물 커뮤니티', showNav = true, showBack = false) {
        // 모든 페이지 숨기기
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        // 대상 페이지 보이기
        document.getElementById(pageId).classList.add('active');
        
        // 헤더 설정
        document.getElementById('header-title').innerText = title;
        document.getElementById('btn-back').style.display = showBack ? 'block' : 'none';
        
        // 하단 네비게이션 설정
        document.getElementById('bottom-nav').style.display = showNav ? 'flex' : 'none';

        // 네비게이션 버튼 활성화 상태 변경
        document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('active'));
        if(pageId === 'page-home') document.getElementById('nav-home').classList.add('active');
        if(pageId === 'page-chat-list') document.getElementById('nav-chat').classList.add('active');
        if(pageId === 'page-mypage') document.getElementById('nav-mypage').classList.add('active');

        // 히스토리 관리 (홈, 챗리스트, 마이페이지는 스택 초기화)
        if(['page-home', 'page-chat-list', 'page-mypage'].includes(pageId)) {
            historyStack = [];
        } else if (historyStack[historyStack.length - 1]?.pageId !== pageId) {
            historyStack.push({ pageId, title, showNav, showBack });
        }
    }

    function goBack() {
        if(historyStack.length > 1) {
            historyStack.pop(); // 현재 페이지 제거
            const prev = historyStack[historyStack.length - 1];
            showPage(prev.pageId, prev.title, prev.showNav, prev.showBack);
            
            // 특정 페이지로 돌아갈 때 데이터 리렌더링
            if(prev.pageId === 'page-board') renderBoardList();
            if(prev.pageId === 'page-home') renderHomeList();
        } else {
            goHome();
        }
    }

    /* ==========================================
       3. 기능별 로직 (인증, 홈, 게시판)
       ========================================== */
    function loginDemo() {
        currentUser.isAuth = true;
        document.getElementById('my-nickname').innerText = currentUser.nickname;
        goHome();
    }

    function logout() {
        currentUser.isAuth = false;
        showPage('page-auth', '위치 인증', false, false);
    }

    function goHome() {
        renderHomeList();
        showPage('page-home', '우리건물 커뮤니티', true, false);
    }

    function renderHomeList() {
        const listArea = document.getElementById('home-post-list');
        listArea.innerHTML = '';
        // 최신글 4개만 표시
        const recentPosts = [...posts].reverse().slice(0, 4);
        recentPosts.forEach(post => {
            listArea.innerHTML += createPostHTML(post);
        });
    }

    let currentCategory = '전체';
    function goCategory(category) {
        currentCategory = category;
        renderBoardList();
        showPage('page-board', category, true, true);
    }

    function renderBoardList() {
        const listArea = document.getElementById('board-post-list');
        listArea.innerHTML = '';
        let filtered = posts;
        if(currentCategory !== '전체') {
            filtered = posts.filter(p => p.category === currentCategory);
        }
        
        if(filtered.length === 0) {
            listArea.innerHTML = '<div style="padding:30px; text-align:center; color:#888;">게시글이 없습니다.</div>';
            return;
        }

        [...filtered].reverse().forEach(post => {
            listArea.innerHTML += createPostHTML(post);
        });
    }

    function createPostHTML(post) {
        return `
            <div class="list-item" onclick="goDetail(${post.id})">
                <span class="tag">${post.category}</span>
                <div class="title">${post.title}</div>
                <div class="preview">${post.content}</div>
                <div class="meta">${post.authorName} · ${post.time} · 댓글 ${post.comments.length}</div>
            </div>
        `;
    }

    /* ==========================================
       4. 글쓰기 로직
       ========================================== */
    function goWrite() {
        document.getElementById('write-title').value = '';
        document.getElementById('write-content').value = '';
        document.getElementById('write-category').value = currentCategory === '전체' ? '자유게시판' : currentCategory;
        checkCategoryRule();
        showPage('page-write', '글쓰기', false, true);
    }

    // [핵심 규칙] 장터/나눔은 익명 불가
    function checkCategoryRule() {
        const category = document.getElementById('write-category').value;
        const anonCheck = document.getElementById('write-anon');
        const warning = document.getElementById('write-warning');
        const anonLabel = document.getElementById('write-anon-label');

        if(category === '장터/나눔') {
            anonCheck.checked = false;
            anonCheck.disabled = true;
            warning.style.display = 'block';
            anonLabel.style.color = '#ccc';
        } else {
            anonCheck.disabled = false;
            warning.style.display = 'none';
            anonLabel.style.color = 'black';
        }
    }

    function submitPost() {
        const category = document.getElementById('write-category').value;
        const title = document.getElementById('write-title').value;
        const content = document.getElementById('write-content').value;
        const isAnon = document.getElementById('write-anon').checked;

        if(!title || !content) {
            alert('제목과 내용을 입력해주세요.');
            return;
        }

        const newPost = {
            id: posts.length + 1,
            category: category,
            title: title,
            content: content,
            authorId: currentUser.id,
            authorName: isAnon ? '익명' : currentUser.nickname,
            isAnon: isAnon,
            time: '방금 전',
            comments: []
        };

        posts.push(newPost);
        alert('게시글이 등록되었습니다.');
        goBack();
    }

    /* ==========================================
       5. 게시글 상세 및 댓글 로직
       ========================================== */
    function goDetail(postId) {
        currentViewPostId = postId;
        const post = posts.find(p => p.id === postId);
        if(!post) return;

        const contentArea = document.getElementById('detail-content-area');
        
        // 본인 글인지 확인하여 채팅버튼 표시 여부 결정
        let chatBtnHtml = '';
        if(post.authorId !== currentUser.id) {
            chatBtnHtml = `<button class="btn-primary" style="margin-top:20px; background-color:#28a745;" onclick="requestChat(${post.id})">💬 작성자에게 채팅 보내기</button>`;
        }

        contentArea.innerHTML = `
            <span class="tag">${post.category}</span>
            <h2 style="margin: 10px 0;">${post.title}</h2>
            <div class="meta" style="margin-bottom: 20px; font-size:14px;">
                ${post.authorName} · ${post.time}
                <span style="float:right; color:red; cursor:pointer;" onclick="openReportModal()">🚨 신고</span>
            </div>
            <div style="line-height: 1.6; font-size: 15px; min-height: 100px;">
                ${post.content.replace(/\n/g, '<br>')}
            </div>
            ${chatBtnHtml}
        `;

        renderComments();
        showPage('page-detail', '게시글', false, true);
    }

    function renderComments() {
        const post = posts.find(p => p.id === currentViewPostId);
        const commentArea = document.getElementById('detail-comments');
        commentArea.innerHTML = '';

        if(post.comments.length === 0) {
            commentArea.innerHTML = '<div style="color:#888; font-size:14px;">등록된 댓글이 없습니다.</div>';
            return;
        }

        post.comments.forEach(c => {
            commentArea.innerHTML += `
                <div class="comment">
                    <div class="comment-meta">
                        <span><b>${c.authorName}</b></span>
                        <span style="color:red; cursor:pointer;" onclick="openReportModal()">신고</span>
                    </div>
                    <div>${c.text}</div>
                </div>
            `;
        });
    }

    function submitComment() {
        const input = document.getElementById('comment-input');
        const isAnon = document.getElementById('comment-anon').checked;
        const text = input.value.trim();

        if(!text) return;

        const post = posts.find(p => p.id === currentViewPostId);
        post.comments.push({
            authorName: isAnon ? '익명' : currentUser.nickname,
            text: text
        });

        input.value = '';
        renderComments();
    }

    /* ==========================================
       6. 채팅 로직 (1:1 채팅)
       ========================================== */
    function requestChat(postId) {
        const post = posts.find(p => p.id === postId);
        
        // 이미 생성된 채팅방이 있는지 확인
        let chat = chats.find(c => c.postId === postId);
        
        if(!chat) {
            chat = {
                id: chats.length + 1,
                postId: post.id,
                postTitle: post.title,
                partnerName: post.authorName, // 장터글은 닉네임, 그외는 익명일 수 있음
                messages: []
            };
            chats.push(chat);
        }
        
        openChatRoom(chat.id);
    }

    function goChatList() {
        const listArea = document.getElementById('chat-list-area');
        listArea.innerHTML = '';

        if(chats.length === 0) {
            listArea.innerHTML = '<div style="padding:30px; text-align:center; color:#888;">참여 중인 채팅이 없습니다.</div>';
        } else {
            [...chats].reverse().forEach(chat => {
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length-1].text : '대화를 시작해보세요.';
                listArea.innerHTML += `
                    <div class="list-item" onclick="openChatRoom(${chat.id})">
                        <div class="title">${chat.partnerName}님과의 대화</div>
                        <div class="preview">${lastMsg}</div>
                        <div class="meta">게시글: ${chat.postTitle}</div>
                    </div>
                `;
            });
        }
        showPage('page-chat-list', '채팅 목록', true, false);
    }

    function openChatRoom(chatId) {
        currentChatId = chatId;
        const chat = chats.find(c => c.id === chatId);
        
        document.getElementById('chat-room-info').innerText = `연결된 게시글: ${chat.postTitle}`;
        renderChatMessages();
        
        // 채팅방은 네비게이션 숨김
        showPage('page-chat-room', chat.partnerName, false, true);
    }

    function renderChatMessages() {
        const chat = chats.find(c => c.id === currentChatId);
        const msgArea = document.getElementById('chat-messages');
        msgArea.innerHTML = '';

        if(chat.messages.length === 0) {
            msgArea.innerHTML = '<div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">매너있는 채팅을 시작해보세요.</div>';
        }

        chat.messages.forEach(m => {
            const className = m.sender === currentUser.id ? 'msg me' : 'msg other';
            msgArea.innerHTML += `<div class="${className}">${m.text}</div>`;
        });
        
        // 스크롤 맨 아래로
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if(!text) return;

        const chat = chats.find(c => c.id === currentChatId);
        chat.messages.push({
            sender: currentUser.id,
            text: text
        });

        input.value = '';
        renderChatMessages();

        // 데모용: 1초 뒤 상대방 자동 응답
        setTimeout(() => {
            chat.messages.push({
                sender: 'other',
                text: '네, 확인했습니다!'
            });
            if(currentChatId === chat.id) renderChatMessages();
        }, 1000);
    }

    /* ==========================================
       7. 마이페이지 및 기타 기능
       ========================================== */
    function goMyPage() {
        showPage('page-mypage', '마이페이지', true, false);
    }

    function openReportModal() {
        document.getElementById('report-modal').style.display = 'flex';
    }

    function closeReportModal() {
        document.getElementById('report-modal').style.display = 'none';
    }

    function submitReport() {
        alert('신고가 정상적으로 접수되었습니다.\n(관리자 검토 후 조치됩니다.)');
        closeReportModal();
    }

</script>
</body>
</html>
